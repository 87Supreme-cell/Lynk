[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lynk"
version = "0.1.0"
description = "A local, evidence-governed research agent"
requires-python = ">=3.11"
dependencies = ["pypdf>=5.0", "psycopg[binary]>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
lynk = "lynk.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
